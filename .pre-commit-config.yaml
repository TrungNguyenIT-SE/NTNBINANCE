minimum_pre_commit_version: "4.7.0"
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/Scripts/ruff.exe check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: ruff-format
        name: ruff format check
        entry: .venv/Scripts/ruff.exe format --check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: mypy
        name: mypy strict
        entry: .venv/Scripts/mypy.exe
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: .venv/Scripts/pytest.exe
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: frontend-check
        name: frontend check
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/frontend-check.ps1
        language: system
        pass_filenames: false
